$schema: https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json
name: Wikidot Code
scopeName: text.wikidot
fileTypes:
  - wd
  - wikidot
patterns:
  - include: "#comment"
  - include: "#yaml-frontmatter"
  # - include: '#block-css'
  - include: "#block-module-css"
  - include: "#block-html"
  - include: "#block-math"
  - include: "#inline-math"
  - include: "#block-include"
  - include: "#block-code"
  - include: "#block-module-begin"
  - include: "#block-module-end"
  # - include: '#block-standalone'
  - include: "#block-standalone-value"
  - include: "#block-standalone-value-map"
  - include: "#block-standalone-map"
  - include: "#block"
  - include: "#block-value"
  # - include: '#block-value-map'
  - include: "#block-map"
  - include: "#block-align"
  - include: "#inline-align"
  - include: "#heading"
  - include: "#list"
  - include: "#horizontal-rule"
  - include: "#separator-rule"
  - include: "#shorthands"
  - include: "#links"
  - include: "#table"
  - include: "#page-variables"
  - include: "#user-variables"
  - include: "#deprecated-variables"
  - include: "#blockquote"
repository:
  shorthands:
    comments: These are the shorthand markups.
    patterns:
      - include: "#color"
      - include: "#italics"
      - include: "#bold"
      - include: "#strikethrough"
      - include: "#underline"
      - include: "#subscript"
      - include: "#superscript"
      - include: "#raw"
      - include: "#teletype"
      - include: "#escape"
      - include: "#ruby-short"
  links:
    comments: These are link syntaxes, and no other syntaxes are allowed within.
    patterns:
      - include: "#link-triple"
      - include: "#link-single"
  attribute:
    patterns:
      - name: meta.attribute.style.wikidot
        begin: style(?![\w:-])
        beginCaptures:
          "0":
            name: entity.other.attribute-name.wikidot
        end: (?=\s*+[^=\s])
        patterns:
          - name: meta.embedded.line.css
            begin: "="
            beginCaptures:
              "0":
                name: punctuation.separator.key-value.wikidot
            end: (?<=(?<=[^\\=])\")(?=[\s\]]*)
            patterns:
              - name: string.quoted.double.wikidot
                begin: '"'
                beginCaptures:
                  "0":
                    name: punctuation.definition.string.begin.wikidot
                end: (")
                endCaptures:
                  "0":
                    name: punctuation.definition.string.end.wikidot
                  "1":
                    name: source.css-ignored-vscode
                contentName: source.css
                pattern:
                  - include: source.css
      - match: (\S+?)\s*(=)\s*((\")(?:[^"]|\\")*((\")))
        captures:
          "1":
            name: entity.other.attribute-name.wikidot
          "2":
            name: punctuation.separator.key-value.wikidot
          "3":
            name: string.quoted.double.wikidot
          "4":
            name: punctuation.definition.string.begin.wikidot
          "5":
            name: punctuation.definition.string.end.wikidot
          "6":
            name: source.css-ignored-vscode
        name: meta.attribute.$1.wikidot
  attribute-messy-include:
    patterns:
      - match: (\|?)\s*(\S+?)\s*(=)\s*((?:(?!\]\])[^\n\|])+)\s*(\|?)
        captures:
          "1":
            name: source.css-ignored-vscode
          "2":
            name: entity.other.attribute-name.wikidot
          "3":
            name: punctuation.separator.key-value.wikidot
          "4":
            name: string.other.value.wikidot
          "5":
            name: source.css-ignored-vscode
        name: meta.attribute.$1.wikidot
  comment:
    name: comment.block.wikidot
    begin: \[\!\-\-
    end: \-\-\]
  yaml-frontmatter:
    name: markup.inserted.text.yaml
    begin: \A^(\-{3})$
    beginCaptures:
      "1":
        name: punctuation.definition.yfm.begin.wikidot
    end: ^(\-{3})$
    endCaptures:
      "1":
        name: punctuation.definition.yfm.end.wikidot
    contentName: meta.embedded.block.yaml
    patterns:
      - include: source.yaml
  ### This was removed from ftml in https://github.com/scpwiki/wikijump/pull/1178
  # block-css:
  #   name: markup.inserted.text.css
  #   begin: (?i)(\[\[)\s*(css)\s*(\]\])
  #   beginCaptures:
  #     '1':
  #       name: punctuation.definition.tag.begin.wikidot
  #     '2':
  #       name: entity.name.tag.wikidot
  #     '3':
  #       name: punctuation.definition.tag.end.wikidot
  #   end: (?i)((\[\[)\s*\/)\s*(css)\s*(\]\])
  #   endCaptures:
  #     '1':
  #       name: punctuation.definition.tag.begin.wikidot
  #     '2':
  #       name: source.css-ignored-vscode
  #     '3':
  #       name: entity.name.tag.wikidot
  #     '4':
  #       name: punctuation.definition.tag.end.wikidot
  #   contentName: meta.embedded.block.css
  #   patterns:
  #     - include: source.css
  block-module-css:
    name: markup.inserted.text.css
    begin: (?i)(\[\[)\s*(module|module654)\s+(css)(?:\s+((?:(?!\]\]).)+))?\s*(\]\])
    beginCaptures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: string.other.value.wikidot
      "4":
        patterns:
          - include: "#attribute"
      "5":
        name: punctuation.definition.tag.end.wikidot
    end: (?i)((\[\[)\s*\/)\s*(module)\s*(\]\])
    endCaptures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
      "3":
        name: entity.name.tag.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    contentName: meta.embedded.block.css
    patterns:
      - include: source.css
  block-html:
    name: markup.inserted.text.html
    begin: (?i)(\[\[)\s*(html|embed)\s*(\]\])
    beginCaptures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: punctuation.definition.tag.end.wikidot
    end: (?i)((\[\[)\s*\/)\s*(html|embed)\s*(\]\])
    endCaptures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
      "3":
        name: entity.name.tag.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    contentName: meta.embedded.block.html
    patterns:
      - include: text.html.basic
  block-math:
    name: markup.inserted.math.display.wikidot
    begin: (?i)(\[\[)\s*(math)\s*(\]\])
    beginCaptures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: punctuation.definition.tag.end.wikidot
    end: (?i)((\[\[)\s*\/)\s*(math)\s*(\]\])
    endCaptures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
      "3":
        name: entity.name.tag.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    contentName: meta.embedded.block.katex
    patterns:
      - include: text.katex
  inline-math:
    name: markup.inserted.math.display.wikidot
    begin: (\[\[)\s*(\$)
    beginCaptures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
    end: (\$)\s*(\]\])
    endCaptures:
      "1":
        name: entity.name.tag.wikidot
      "2":
        name: punctuation.definition.tag.end.wikidot
    contentName: meta.embedded.inline.katex
    patterns:
      - include: text.katex
  block-include:
    name: meta.block.structure.standalone.wikidot
    begin: (?i)(\[\[)\s*(include(?:-messy)?)\s*\s+([^\s\]]+)(?=\s|\]\])
    beginCaptures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: string.other.value.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    end: \]\]
    endCaptures:
      "0":
        name: punctuation.definition.tag.end.wikidot
    patterns:
      - include: "#attribute-messy-include"
  block-code:
    name: meta.block.structure.standalone.wikidot
    begin: (?i)(\[\[)\s*(code)(?:\s+((?:(?!\]\]).)+))?\s*(\]\])
    beginCaptures:
      "0":
        name: meta.block.structure.begin.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        patterns:
          - include: "#attribute"
      "4":
        name: punctuation.definition.tag.end.wikidot
    end: ((\[\[)\/)\s*(code)\s*(\]\])
    endCaptures:
      "0":
        name: meta.block.structure.end.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
      "3":
        name: entity.name.tag.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    contentName: markup.raw
  block-module-begin:
    match: >-
      (?i)(\[\[)\s*(module|module654)\s+([^\s\]]+)(?:\s+((?:(?!\]\]).)+))?\s*(\]\])
    captures:
      "0":
        name: meta.block.structure.begin.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: string.other.value.wikidot
      "4":
        patterns:
          - include: "#attribute"
      "5":
        name: punctuation.definition.tag.end.wikidot
    name: meta.block.structure.module.$3.wikidot
  block-module-end:
    name: meta.block.structure.module.end.wikidot
    match: (?i)((\[\[)\/)\s*(module|module654)\s*(\]\])
    captures:
      "0":
        name: meta.block.structure.end.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
      "3":
        name: entity.name.tag.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
  block-standalone:
    match: (?i)(\[\[)\s*()\s*(\]\])
    captures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: punctuation.definition.tag.end.wikidot
    name: meta.block.structure.$2.standalone.wikidot
  block-standalone-value:
    match: >-
      (?i)(\[\[)\s*(char|character|equation|eref|eqref|lines|newlines|target|target|anchortarget|user|\*user)\s+((?:(?!\]\]).)+)\s*(\]\])
    captures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: string.other.value.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    name: meta.block.structure.$2.standalone.wikidot
  block-standalone-value-map:
    match: >-
      (?i)(\[\[)\s*(date|iframe|image|=image|<image|>image|f<image|f>image|include-elements|radio|radio-button|\*radio|\*radio-button)\s+([^\s\]]+)(?:\s+((?:(?!\]\]).)+))?\s*(\]\])
    captures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: string.other.value.wikidot
      "4":
        patterns:
          - include: "#attribute"
      "5":
        name: punctuation.definition.tag.end.wikidot
    name: meta.block.structure.$2.standalone.wikidot
  block-standalone-map:
    match: >-
      (?i)(\[\[)\s*(checkbox|\*checkbox|footnoteblock|toc|f<toc|f>toc)(?:\s+((?:(?!\]\]).)+))?\s*(\]\])
    captures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        patterns:
          - include: "#attribute"
      "4":
        name: punctuation.definition.tag.end.wikidot
    name: meta.block.structure.$2.standalone.wikidot
  block:
    begin: (?i)(\[\[)\s*(footnote|tabview|tabs)\s*(\]\])
    beginCaptures:
      "0":
        name: meta.block.structure.begin.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: punctuation.definition.tag.end.wikidot
    end: (?i)((\[\[)\/)\s*(footnote|tabview|tabs)\s*(\]\])
    endCaptures:
      "0":
        name: meta.block.structure.end.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
      "3":
        name: entity.name.tag.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    name: meta.block.structure.$2.wikidot
    patterns:
      - include: $self
  block-value:
    begin: (?i)(\[\[)\s*(ifcategory|iftags|size|tab)\s+((?:(?!\]\]).)+)\s*(\]\])
    beginCaptures:
      "0":
        name: meta.block.structure.begin.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: string.other.value.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    end: (?i)((\[\[)\/)\s*(ifcategory|iftags|size|tab)\s*(\]\])
    endCaptures:
      "0":
        name: meta.block.structure.end.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
      "3":
        name: entity.name.tag.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    name: meta.block.structure.$2.wikidot
    patterns:
      - include: $self
  block-value-map:
    begin: (?i)(\[\[)\s*()\s+([^\s\]]+)(?:\s+((?:(?!\]\]).)+))?\s*(\]\])
    beginCaptures:
      "0":
        name: meta.block.structure.begin.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: string.other.value.wikidot
      "4":
        patterns:
          - include: "#attribute"
      "5":
        name: punctuation.definition.tag.end.wikidot
    end: (?i)((\[\[)\/)\s*()\s*(\]\])
    endCaptures:
      "0":
        name: meta.block.structure.end.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
      "3":
        name: entity.name.tag.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    name: meta.block.structure.$2.wikidot
    patterns:
      - include: $self
  block-map:
    begin: >-
      (?i)(\[\[)\s*(anchor_|a_|anchor|a|\*anchor_|\*a_|\*anchor|\*a|blockquote|quote|bold|b|strong|collapsible|del|deletion|div_|div|hidden|ins|insertion|invisible|italics|i|em|emphasis|ol_|ol|ul_|ul|li_|li|mark|highlight|monospace|tt|mono|paragraph|p|ruby|rt|rubytext|span_|span|strikethrough|s|subscript|sub|superscript|sup|super|table|cell|hcell|row|underline|u)(?:\s+((?:(?!\]\]).)+))?\s*(\]\])
    beginCaptures:
      "0":
        name: meta.block.structure.begin.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        patterns:
          - include: "#attribute"
      "4":
        name: punctuation.definition.tag.end.wikidot
    end: >-
      (?i)((\[\[)\/)\s*(anchor_|a_|anchor|a|\*anchor_|\*a_|\*anchor|\*a|blockquote|quote|bold|b|strong|collapsible|del|deletion|div_|div|hidden|ins|insertion|invisible|italics|i|em|emphasis|ol_|ol|ul_|ul|li_|li|mark|highlight|monospace|tt|mono|paragraph|p|ruby|rt|rubytext|span_|span|strikethrough|s|subscript|sub|superscript|sup|super|table|cell|hcell|row|underline|u)\s*(\]\])
    endCaptures:
      "0":
        name: meta.block.structure.end.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
      "3":
        name: entity.name.tag.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    name: meta.block.structure.$2.wikidot
    patterns:
      - include: $self
  block-align:
    name: meta.block.structure.align.wikidot
    begin: (\[\[)\s*(\<|\>|\=|\=\=)\s*(\]\])
    beginCaptures:
      "0":
        name: meta.block.structure.begin.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.tag.wikidot
      "3":
        name: punctuation.definition.tag.end.wikidot
    end: ((\[\[)\s*\/)\s*(\<|\>|\=|\=\=)\s*(\]\])
    endCaptures:
      "0":
        name: meta.block.structure.end.wikidot
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
      "3":
        name: entity.name.tag.wikidot
      "4":
        name: punctuation.definition.tag.end.wikidot
    patterns:
      - include: $self
  blockquote:
    name: markup.quote.wikidot
    begin: ^(>+)\s
    end: $
    begincaptures:
      "1":
        name: punctuation.definition.quote.wikidot
    patterns:
      - include: "#block"
      - include: "#shorthands"
  inline-align: 
    name: markup.align.wikidot
    match: ^(\=)\s
    captures:
      "1":
        name: punctuation.definition.align.wikidot
  heading:
    name: markup.heading.wikidot
    match: ^(\+{1,6}\*?)(?=\s*)(.*)
    captures:
      "1":
        name: punctuation.definition.header.wikidot
      "2":
        name: entity.name.section.wikidot
  list:
    name: markup.list.wikidot
    match: ^\s*(\*|\#)(?=\s)
    captures:
      "1":
        name: punctuation.definition.list.wikidot
  color:
    name: markup.color.wikidot
    begin: (\#\#)\s*(\#\d+|[^\n\|]+)\s*(\|)
    captures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: entity.name.variable.wikidot
      "3":
        name: punctuation.separator.key-value.wikidot
    end: \#\#
    endCaptures:
      "0":
        name: punctuation.definition.tag.end.wikidot
    patterns:
      - include: $self
  italics:
    name: markup.italic.wikidot
    begin: (?<!\:)\/\/
    beginCaptures:
      "0":
        name: punctuation.definition.tag.begin.wikidot
    end: \/\/
    endCaptures:
      "0":
        name: punctuation.definition.tag.end.wikidot
    patterns:
      - include: $self
  bold:
    name: markup.bold.wikidot
    begin: \*\*(?=[^\n]*[\S]\*\*)
    beginCaptures:
      "0":
        name: punctuation.definition.tag.begin.wikidot
    end: \*\*
    endCaptures:
      "0":
        name: punctuation.definition.tag.end.wikidot
    patterns:
      - include: $self
  strikethrough:
    name: markup.strikethrough.wikidot
    begin: \-\-(?=[^\n]*[\S]\-\-)
    beginCaptures:
      "0":
        name: punctuation.definition.tag.begin.wikidot
    end: \-\-
    endCaptures:
      "0":
        name: punctuation.definition.tag.end.wikidot
    patterns:
      - include: $self
  underline:
    name: markup.underline.wikidot
    begin: \_\_
    beginCaptures:
      "0":
        name: punctuation.definition.tag.begin.wikidot
    end: \_\_
    endCaptures:
      "0":
        name: punctuation.definition.tag.end.wikidot
    patterns:
      - include: $self
  subscript:
    name: markup.subscript.wikidot
    begin: \,\,
    beginCaptures:
      "0":
        name: punctuation.definition.tag.begin.wikidot
    end: \,\,
    endCaptures:
      "0":
        name: punctuation.definition.tag.end.wikidot
    patterns:
      - include: $self
  superscript:
    name: markup.subscript.wikidot
    begin: \^\^
    beginCaptures:
      "0":
        name: punctuation.definition.tag.begin.wikidot
    end: \^\^
    endCaptures:
      "0":
        name: punctuation.definition.tag.end.wikidot
    patterns:
      - include: $self
  teletype:
    name: markup.teletype.wikidot
    begin: \{\{
    beginCaptures:
      "0":
        name: punctuation.definition.tag.begin.wikidot
    end: \}\}
    endCaptures:
      "0":
        name: punctuation.definition.tag.end.wikidot
    patterns:
      - include: $self
  raw:
    name: markup.raw.wikidot
    match: (\@\@)\s*((?:(?!\@\@).)+)\s*(?<=[^\@])(\@\@)
    captures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: string.other.raw.wikidot
      "3":
        name: punctuation.definition.tag.end.wikidot
  escape:
    name: markup.raw.wikidot
    match: (\@\<)\s*((?:(?!\>\@).)+)\s*(\>\@)
    captures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: string.other.escape.wikidot
      "3":
        name: punctuation.definition.tag.end.wikidot
  link-triple:
    name: markup.underline.link.wikidot
    match: >-
      ((\[\[\[)\s*(?:\*)?)\s*((?:(?!\]\]\])[^\*\n\|])+)\s*(?:(\|)\s*((?:(?!\]\]\]).)+)?)?\s*(?<=[^\]])(\]\]\])
    captures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
      "3":
        name: entity.name.variable.wikidot
      "4":
        name: punctuation.separator.key-value.wikidot
      "5":
        name: string.other.value.wikidot
      "6":
        name: punctuation.definition.tag.end.wikidot
  link-single:
    name: markup.underline.link.wikidot
    match: >-
      ((\[)\s*(?:\*)?)\s*((?:\/(?!\/)|\#|(?:[^\:\/]+\:)?\/\/)[^\n\s\|]+)\s+((?:(?!\]).)+)?\s*(?<=[^\]])(\])
    captures:
      "1":
        name: punctuation.definition.tag.begin.wikidot
      "2":
        name: source.css-ignored-vscode
