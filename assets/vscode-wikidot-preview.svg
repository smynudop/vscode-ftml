<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 256 256" role="img" aria-label="SCP icon">
    <rect x="0" y="0" width="256" height="256" rx="32" ry="32" fill="#ebebeb" />
    <text x="50%" y="40%" text-anchor="middle" font-family="Verdana, Meiryo" font-weight="700" font-size="90"
        fill="#2b2828">Wiki</text>
    <rect x="28" y="140" width="200" height="90" rx="16" ry="16" fill="#e63630" />

    <!-- 'dot' の 'o' を虫眼鏡に置き換え -->
    <g aria-label="dot with magnifier" role="img">
        <text x="36" y="83%" text-anchor="start" font-family="Verdana, Meiryo" font-weight="700" font-size="90"
            fill="white">d</text>

        <!-- 虫眼鏡本体: 外枠とレンズ (白枠 + 背景色でレンズ表現) -->
        <g transform="translate(128,179)" aria-hidden="false">
            <!-- 外枠を太く -->
            <circle cx="0" cy="0" r="22" fill="none" stroke="white" stroke-width="11" />
            <!-- レンズは色なし（透明）にする -->
            <circle cx="0" cy="0" r="20" fill="none" />
            <!-- 持ち手：少し上に、短めに、角度を少し浅く -->
            <rect x="22" y="4" width="30" height="10" rx="5" ry="5" transform="rotate(40)" fill="white" />
        </g>

        <text x="168" y="83%" text-anchor="start" font-family="Verdana, Meiryo" font-weight="700" font-size="90"
            fill="white">t</text>
    </g>
</svg>